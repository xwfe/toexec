# stable 上查格式、Clippy、跑测试；另在 Cargo.toml 声明的 rust-version 上
# 编译一遍；再在 Windows 上把测试真跑一遍。
#
# 老版本那一遍为什么要有：gld 和 ccnm 按 tag 链接这里，三个仓库的
# rust-version 统一（v2 计划第 11 节）。只跑 stable 的话，用了比声明更新的
# std API 照样全绿，要等两个产品的 MSRV 任务，或者有人拿声明的版本装的时候
# 才炸出来。
#
# Windows 那一遍为什么要有：`toexec-fs` 的替换语义在那里跟 Unix 不一样
# （只读属性、独占打开的文件、`FileRenameInfoEx` 的可用性），而交叉编译只
# 能证明代码编得过。X01 修的就是这个平台上会丢文件的老实现。
#
# 只用 GitHub 自己的 action：两个 crate 都没有依赖，编译几秒钟，用不着缓存，
# 也就没理由多引一个第三方 action。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本只写在 Cargo.toml 一处。以后三仓一起升 rust-version 时这里不用
      # 跟着改，也就不会出现"声明升了、CI 还在测旧版本"。
      - name: 装 Cargo.toml 里 rust-version 写的版本
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          case "$msrv" in
            ''|*[!0-9.]*)
              echo "::error::根 Cargo.toml 要有且只有一行 rust-version = \"x.y\"，实际读到：$msrv"
              exit 1 ;;
          esac
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: cargo +"$MSRV" check --workspace --all-targets --locked

  windows:
    runs-on: windows-latest
    # sed / case 这些在 windows runner 的默认 pwsh 里没有；runner 自带 Git
    # Bash，用它就跟上面两个 job 写法一致。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 装 stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      # 格式不看：跨平台结果一样，上面那个 job 已经查过。Clippy 要看，因为
      # 有一批 lint 只对 `cfg(windows)` 下的代码生效。
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 失败时把 panic 那几行塞进 annotation：这个仓库虽然公开，完整日志还是
      # 要登录 GitHub 才看得到，而 annotation 匿名读得到。不这么干，外面能看
      # 见的就只有"exit code 101"，连挂的是哪条测试都不知道。
      # `%0A` 是 Actions 里的换行转义。
      - name: cargo test
        run: |
          if cargo test --workspace --locked 2>&1 | tee test.log; then
            exit 0
          fi
          msg=$(grep -E -A 3 "panicked at|^failures:|FAILED" test.log | head -40 | awk '{printf "%s%%0A", $0}')
          echo "::error title=cargo test 失败::$msg"
          exit 1
      # 两个产品链接的是 Cargo.toml 声明的那个版本，所以 Windows 的文件替换
      # 也要在那个版本上真跑过——不然这里只有 Linux 的编译证据。格式校验在
      # 上面的 msrv job 里做了，这里读不到就让 rustup 自己报错。
      - name: 在 rust-version 声明的版本上再跑一遍
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --workspace --locked
