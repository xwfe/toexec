[workspace]
resolver = "3"
members = ["crates/toexec-text", "crates/toexec-fs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 三个仓库统一到 1.89（用户 2026-09-15 的决定，时点是第一个共享 crate 被产品
# 链接时）。1.89 这个下限来自 ccnm：它的 apply_patch 用 File::try_lock 区分
# “被打断的提交”和“还在跑的提交”。
rust-version = "1.89"
license = "MIT"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
